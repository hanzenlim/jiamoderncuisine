# Canonicalise every page onto its extensionless URL so Google sees one
# indexable URL per page instead of a .html / no-.html pair.
# force = true is required because the source .html files exist on disk.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

